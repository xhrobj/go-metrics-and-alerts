sonar.organization=xhrobj
sonar.projectKey=xhrobj_go-metrics-and-alerts

sonar.sources=.
sonar.tests=.
sonar.test.inclusions=\
  **/*_test.go,\
  internal/encryption/testkeys/**

sonar.go.coverage.reportPaths=coverage.out

sonar.coverage.exclusions=\
  cmd/**/main.go,\
  internal/agent/config/**,\
  internal/server/config/**,\
  internal/server/transport/http/handler/mocks/**,\
  internal/logger/**,\
  internal/model/**,\
  migrations/**,\
  **/*_test.go

# Фикстуры инструментов cmd/staticlint/noosexit и cmd/reset содержат
# тестовый код и не должны анализироваться как production-код.
sonar.exclusions=\
  cmd/staticlint/noosexit/testdata/**,\
  cmd/reset/testdata/**

# CPD-исключения оставлены здесь для видимости как намерение.
# Фактически из этого файла они не сработали и были настроены в UI SonarCloud
sonar.cpd.exclusions=\
  **/*_test.go,\
  migrations/**
