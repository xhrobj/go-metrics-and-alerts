sonar.projectKey=xhrobj_go-metrics-and-alerts
sonar.organization=xhrobj

sonar.sources=.

sonar.exclusions=\
  cmd/staticlint/noosexit/testdata/**

sonar.coverage.exclusions=\
  cmd/**,\
  internal/config/**,\
  internal/agent/config/**,\
  internal/handler/config/**,\
  internal/logger/**,\
  internal/model/**,\
  migrations/**,\
  **/*_test.go

# CPD-исключения оставлены здесь для видимости как намерение.
# Фактичски отсюда они не сработали и были настроены в UI SonarCloud
sonar.cpd.exclusions=\
  **/*_test.go,\
  migrations/**
